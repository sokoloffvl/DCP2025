  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; width: 100%; background: #f8f8f8; display:none; }
    #msg {
      display:flex; height:100vh; align-items:center; justify-content:center;
      font-family: system-ui, sans-serif; color:#444; text-align:center; padding: 0 16px;
    }
    .legend {
      position: absolute; z-index: 1000; bottom: 16px; left: 16px;
      background: #fff; padding: 10px 12px; border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15); font: 14px/1.2 system-ui, sans-serif;
      display:none;
    }
    .popup-content { font-size: 1rem; line-height: 1.4rem; padding: 4px; max-width: 260px; }
    code.hash { background:#f1f3f5; padding:2px 6px; border-radius:6px; }
    .riddle-label {
      /* Single label per merged area */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      font: 700 18px/1 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: #0d47a1;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }
  </style>

    let map, mergedGroup;
    const legend = document.querySelector(".legend");
    const msg = document.getElementById("msg");
    const mapDiv = document.getElementById("map");

    function initMapIfNeeded() {
      if (map) return;
      map = L.map('map', { zoomControl: true }).setView([51.5149, -0.1335], 16);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap &copy; CartoDB',
        maxZoom: 20
      }).addTo(map);
    }

    function clearMap() {
      if (mergedGroup) {
        mergedGroup.remove();
        mergedGroup = null;
      }
    }

    function renderList(locations) {
      clearMap();
      mergedGroup = L.featureGroup().addTo(map);

      // Build Turf circles (for merging + popup content)
      const circlePolys = locations.map((loc, i) => {
        const poly = turf.circle([loc.coords[1], loc.coords[0]], loc.radius / 1000, { steps: 64, units: "kilometers" });
        poly.properties = { index: i };
        return poly;
      });

      // Merge overlaps into areas
      let unioned = circlePolys[0];
      for (let i = 1; i < circlePolys.length; i++) unioned = turf.union(unioned, circlePolys[i]);
      const flattened = turf.flatten(unioned);
      const colors = getColors();
      const areaStyle = { color: colors.outline, weight: 2, fillColor: colors.fill, fillOpacity: 0.25 };
      const areaHoverStyle = { color: colors.hover, weight: 3, fillOpacity: 0.3 };

      flattened.features.forEach(area => {
        const riddles = [];
        circlePolys.forEach((c, i) => {
          if (turf.booleanIntersects(area, c)) riddles.push({ riddle: locations[i].riddle, number: i + 1, length: locations[i].length });
        });

        if (riddles.length) {
          // Area polygon + popup
          const popupHtml = riddles
            .map(r => `
              <div class="popup-content">
                <strong>Riddle ${r.number}</strong><br/>
                ${r.riddle}<br/>
                <em>(${r.length} letters)</em>
              </div>
            `)
            .join("<hr>");

          const layer = L.geoJSON(area, { style: areaStyle }).addTo(mergedGroup);
          layer.bindPopup(popupHtml);
          layer.on("mouseover", () => layer.setStyle(areaHoverStyle));
          layer.on("mouseout",  () => layer.setStyle(areaStyle));

          // --- Single label per merged area (comma-separated numbers) ---
          const labelText = riddles
            .map(r => r.number)
            .sort((a, b) => a - b)
            .join(", ");

          const centroid = turf.centerOfMass(area).geometry.coordinates; // [lng, lat]
          const latlng = [centroid[1], centroid[0]];

          const areaIcon = L.divIcon({
            className: "riddle-label",
            html: labelText
          });

          L.marker(latlng, {
            icon: areaIcon,
            interactive: false,
            keyboard: false,
            zIndexOffset: 1000
          }).addTo(mergedGroup);
        }
      });

      // Fit AFTER visible so Leaflet gets real size; cap zoom to stay nicely in
      setTimeout(() => {
        if (mergedGroup.getLayers().length) {
          const bounds = mergedGroup.getBounds();
          map.fitBounds(bounds, { padding: [30, 30], maxZoom: 17 });
        } else {
          map.setView([51.5149, -0.1335], 16);
        }
        map.invalidateSize();
      }, 150);
    }

    function setVisible(isVisible) {
      mapDiv.style.display = isVisible ? "block" : "none";
      legend.style.display = isVisible ? "block" : "none";
      msg.style.display = isVisible ? "none" : "flex";
      if (isVisible && map) {
        setTimeout(() => map.invalidateSize(), 150);
      }
    }

    function getColors() {
      switch (window.location.hash) {
        case ROUTE_LIST_ONE:
          return {outline: "#1e88e5", fill: "#64b5f6", hover: "#1565c0"};
          break;
        case ROUTE_LIST_TWO:
          return {outline: "#ece207", fill: "#fef30c", hover: "#ded406"};
          break;
        case ROUTE_LIST_THREE:
          return {outline: "#d13397", fill: "#f840b5", hover: "#c31684"};
          break;
        case ROUTE_LIST_FOUR:
          return {outline: "#64cf55", fill: "#7df56d", hover: "#2ab317"};
          break;
        default:
          return {outline: "#1e88e5", fill: "#64b5f6", hover: "#1565c0"};
      }
    }

    function route() {
      initMapIfNeeded();
      switch (window.location.hash) {
        case ROUTE_LIST_ONE:
          setVisible(true);
          renderList(LIST_ONE);
          break;
        case ROUTE_LIST_TWO:
          setVisible(true);
          renderList(LIST_TWO);
          break;
        case ROUTE_LIST_THREE:
          setVisible(true);
          renderList(LIST_THREE);
          break;
        case ROUTE_LIST_FOUR:
          setVisible(true);
          renderList(LIST_FOUR);
          break;
        default:
          setVisible(false);
      }
    }

    window.addEventListener("hashchange", route);
    window.addEventListener("load", route);
  </script>
